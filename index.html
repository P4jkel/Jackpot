<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Urodzinowa Maszyna Losująca 🎰</title>
  <style>
    :root{
      --card: rgba(255,255,255,0.06);
      --stroke: rgba(255,255,255,0.12);
      --stroke2: rgba(255,255,255,0.18);
      --text: #fff;
    }
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin:0; min-height:100vh;
      display:flex; align-items:center; justify-content:center;
      background: radial-gradient(circle at top, #222, #0b0b0b);
      color:var(--text);
      overflow:hidden;
    }
    .card{
      width:min(560px, 92vw);
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.55);
      text-align:center;
      position:relative;
      backdrop-filter: blur(6px);
    }
    h1{ margin: 6px 0 10px; font-size: 1.6rem; }
    .subtitle{ opacity:0.85; margin-bottom:14px; }
    .slot{
      display:flex; gap:12px; justify-content:center;
      margin: 16px 0 10px;
    }
    .window{
      width: 120px; height: 92px;
      border-radius: 14px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.14);
      display:flex; align-items:center; justify-content:center;
      font-size: 2.2rem;
      user-select:none;
      position:relative;
      overflow:hidden;
    }
    .window::after{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.10), transparent 45%, rgba(0,0,0,0.25));
      pointer-events:none;
    }
    button{
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: none;
      font-size: 1.05rem;
      font-weight: 900;
      background: linear-gradient(90deg, #ffcc00, #ff5a00);
      color:#111;
      cursor:pointer;
      margin-top: 10px;
      box-shadow: 0 10px 30px rgba(255,120,0,0.18);
    }
    button:disabled{ opacity:0.6; cursor:not-allowed; }
    .ghost{
      background: rgba(255,255,255,0.10);
      color: #fff;
      border: 1px solid var(--stroke2);
      font-weight: 800;
      box-shadow:none;
    }
    .result{
      margin-top: 14px;
      font-size: 1rem;
      line-height: 1.4;
      min-height: 4.2em;
    }
    .prize{
      display:inline-block;
      margin-top:10px;
      padding:10px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      border: 1px dashed rgba(255,255,255,0.25);
      font-size: 1.2rem;
      font-weight: 1000;
    }
    .tiny{ opacity:0.65; margin-top:14px; font-size:0.92rem; }

    /* Jackpot glow */
    .jackpot{
      animation: glow 900ms ease-in-out infinite alternate;
    }
    @keyframes glow{
      from{ box-shadow: 0 0 0 rgba(255,180,0,0); }
      to{ box-shadow: 0 0 40px rgba(255,180,0,0.32); }
    }

    /* Confetti layer */
    #confetti{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index: 999;
    }
    .conf{
      position:absolute;
      top:-12px;
      width:10px; height:14px;
      border-radius: 3px;
      opacity:0.95;
      transform: translate3d(0,0,0) rotate(0deg);
      animation: fall linear forwards;
    }
    @keyframes fall{
      to{
        transform: translate3d(var(--dx), 110vh, 0) rotate(720deg);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div id="confetti"></div>

  <div class="card" id="card">
    <h1>Urodzinowa Maszyna Losująca 🎰</h1>
    <div class="subtitle">Kliknij i “wylosuj” prezent (bez hazardu — tylko żart!)</div>

    <div class="slot">
      <div class="window" id="w1">🎁</div>
      <div class="window" id="w2">🎉</div>
      <div class="window" id="w3">⭐</div>
    </div>

    <button id="spinBtn">LOSUJ!</button>
    <button id="claimBtn" class="ghost" style="display:none;">ODBIERZ NAGRODĘ</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    // ====== USTAWIENIA ======
    const PRIZE_VALUE = "100 zł"; // <- zmień wartość jeśli chcesz
    const FINAL_SYMBOL = "🎁";

    // Symbole do kręcenia
    const symbols = ["🍒","🍋","🔔","🍀","💎","7️⃣","⭐","🎁","🎉"];

    // ====== ELEMENTY ======
    const w1 = document.getElementById("w1");
    const w2 = document.getElementById("w2");
    const w3 = document.getElementById("w3");
    const btn = document.getElementById("spinBtn");
    const claimBtn = document.getElementById("claimBtn");
    const result = document.getElementById("result");
    const card = document.getElementById("card");
    const confettiLayer = document.getElementById("confetti");

    // ====== AUDIO (bez plików) ======
    let audioCtx = null;

    function ensureAudio(){
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = Ctx ? new Ctx() : null;
      }
      // iOS czasem wymaga resume po kliknięciu
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    }

    function beep(freq=440, duration=0.06, type="square", gain=0.03){
      if (!audioCtx) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.value = gain;

      o.connect(g);
      g.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      g.gain.setValueAtTime(gain, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      o.start(now);
      o.stop(now + duration);
    }

    function clickSound(){
      ensureAudio();
      beep(520, 0.04, "square", 0.02);
      beep(780, 0.05, "square", 0.018);
    }

    function tickSound(){
      // cichy tick do kręcenia
      beep(220 + Math.random()*40, 0.02, "square", 0.012);
    }

    async function fanfare(){
      ensureAudio();
      // krótka fanfara: kilka nut
      const notes = [523, 659, 784, 1046, 988, 1046];
      for (let i = 0; i < notes.length; i++){
        beep(notes[i], 0.10, "sawtooth", 0.025);
        await sleep(90);
      }
    }

    // ====== LOSOWANIE / ANIMACJE ======
    function randSym() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }
    function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

    async function spinWindow(el, steps, delayMin, delayMax, doTick=true){
      for (let i = 0; i < steps; i++){
        el.textContent = randSym();
        if (doTick && i % 2 === 0) tickSound();
        const d = delayMin + Math.random() * (delayMax - delayMin);
        await sleep(d);
      }
    }

    function setJackpotUI(on){
      if (on) card.classList.add("jackpot");
      else card.classList.remove("jackpot");
    }

    // ====== CONFETTI ======
    function spawnConfetti(count=90, durationMs=1600){
      confettiLayer.innerHTML = "";
      const w = window.innerWidth;
      for (let i = 0; i < count; i++){
        const p = document.createElement("div");
        p.className = "conf";
        // losowa pozycja startowa i odchylenie
        const left = Math.random() * w;
        const dx = (Math.random() * 240 - 120) + "px";
        const dur = (900 + Math.random()*900) + "ms";
        const delay = (Math.random()*180) + "ms";

        // losowy kolor (inline, bez ustalania globalnej palety)
        p.style.background = `hsl(${Math.floor(Math.random()*360)}, 90%, 60%)`;
        p.style.left = left + "px";
        p.style.setProperty("--dx", dx);
        p.style.animationDuration = dur;
        p.style.animationDelay = delay;

        confettiLayer.appendChild(p);
      }
      // posprzątaj po chwili
      setTimeout(() => { confettiLayer.innerHTML = ""; }, durationMs + 900);
    }

    // ====== GŁÓWNY FLOW: prawie wygrana -> jackpot ======
    async function spin() {
      ensureAudio();
      clickSound();

      btn.disabled = true;
      claimBtn.style.display = "none";
      setJackpotUI(false);

      result.textContent = "Kręcę… 🎰";
      // Start: wszystkie kręcą krótko
      const baseSpin = Promise.all([
        spinWindow(w1, 10, 35, 70),
        spinWindow(w2, 10, 35, 70),
        spinWindow(w3, 10, 35, 70)
      ]);
      await baseSpin;

      // 😈 Prawie wygrana: dwa zatrzymują się na prezencie, trzeci kręci dłużej
      w1.textContent = FINAL_SYMBOL;
      w2.textContent = FINAL_SYMBOL;
      result.innerHTML = `Ooo! PRAWIE… 😈<br/>Dwa już siadły na <b>${FINAL_SYMBOL}</b>…`;

      // Trzeci kręci dłużej, zwalniając
      await spinWindow(w3, 22, 45, 120, true);

      // Mały “zawis” na czymś innym (daje napięcie)
      w3.textContent = "💎";
      beep(180, 0.08, "sine", 0.02);
      await sleep(380);

      // Jackpot!
      w3.textContent = FINAL_SYMBOL;
      await sleep(120);

      setJackpotUI(true);
      spawnConfetti(110, 1800);
      fanfare();

      result.innerHTML = `
        <b>JACKPOT! 🥳</b><br/>
        WYGRAŁEŚ VOUCHER O WARTOŚCI:<br/>
        <span class="prize">${PRIZE_VALUE}</span><br/>
        <span style="opacity:.85">Kod vouchera odbierzesz osobiście 😄</span>
      `;

      claimBtn.style.display = "block";
      btn.disabled = false;
    }

    claimBtn.addEventListener("click", () => {
      ensureAudio();
      clickSound();
      alert("Zgłoś się do mnie po kod vouchera 😄");
    });

    btn.addEventListener("click", spin);

    // Bonus: lekkie “przebudzenie” audio po pierwszym dotknięciu (na mobile)
    window.addEventListener("pointerdown", ensureAudio, { once: true });
  </script>
</body>
</html>
