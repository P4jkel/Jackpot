<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maszyna Losująca Prezent 🎰</title>
  <style>
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin:0; min-height:100vh;
      display:flex; align-items:center; justify-content:center;
      background: radial-gradient(circle at top, #222, #0b0b0b);
      color:#fff;
    }
    .card{
      width:min(520px, 92vw);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.5);
      text-align:center;
    }
    h1{ margin: 6px 0 14px; font-size: 1.6rem; }
    .subtitle{ opacity:0.85; margin-bottom:18px; }
    .slot{ display:flex; gap:12px; justify-content:center; margin: 18px 0 14px; }
    .window{
      width: 110px; height: 90px;
      border-radius: 14px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.14);
      display:flex; align-items:center; justify-content:center;
      font-size: 2rem;
      user-select:none;
    }
    button{
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: none;
      font-size: 1.05rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ffcc00, #ff5a00);
      color:#111;
      cursor:pointer;
      margin-top: 10px;
    }
    button:disabled{ opacity:0.6; cursor:not-allowed; }
    .ghost{
      background: rgba(255,255,255,0.10);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      font-weight: 700;
    }
    .result{
      margin-top: 14px;
      font-size: 1rem;
      line-height: 1.35;
      min-height: 3.2em;
    }
    .prize{
      display:inline-block;
      margin-top:10px;
      padding:10px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      border: 1px dashed rgba(255,255,255,0.25);
      font-size: 1.2rem;
      font-weight: 900;
    }
    .tiny{ opacity:0.65; margin-top:16px; font-size:0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Urodzinowa Maszyna Losująca 🎰</h1>
    <div class="subtitle">Kliknij i “wylosuj” prezent!</div>

    <div class="slot">
      <div class="window" id="w1">🎁</div>
      <div class="window" id="w2">🎉</div>
      <div class="window" id="w3">⭐</div>
    </div>

    <button id="spinBtn">LOSUJ!</button>
    <button id="claimBtn" class="ghost" style="display:none;">ODBIERZ NAGRODĘ</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    const PRIZE_VALUE = "100 zł"; // tu możesz zmienić kwotę
    const symbols = ["🍒","🍋","🔔","🍀","💎","7️⃣","⭐","🎁"];

    const w1 = document.getElementById("w1");
    const w2 = document.getElementById("w2");
    const w3 = document.getElementById("w3");
    const btn = document.getElementById("spinBtn");
    const claimBtn = document.getElementById("claimBtn");
    const result = document.getElementById("result");

    function randSym() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }
    function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

    async function spin() {
      btn.disabled = true;
      claimBtn.style.display = "none";
      result.textContent = "Kręcę… 🎰";

      for (let i = 0; i < 18; i++) {
        w1.textContent = randSym();
        w2.textContent = randSym();
        w3.textContent = randSym();
        await sleep(70);
      }

      // Finał: "jackpot"
      w1.textContent = "🎁";
      w2.textContent = "🎁";
      w3.textContent = "🎁";
      await sleep(200);

      result.innerHTML = `
        JACKPOT! 🥳<br/>
        WYGRAŁEŚ VOUCHER O WARTOŚCI:<br/>
        <span class="prize">${PRIZE_VALUE}</span><br/>
        <span style="opacity:.8">Kod vouchera odbierzesz osobiście 😄</span>
      `;

      claimBtn.style.display = "block";
      btn.disabled = false;
    }

    claimBtn.addEventListener("click", () => {
      alert("Zgłoś się do mnie po kod vouchera 😄");
    });

    btn.addEventListener("click", spin);
  </script>
</body>
</html>
